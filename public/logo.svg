<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Islamic geometric pattern - Star -->
  <g transform="translate(100, 100)" fill="white" opacity="0.9">
    <!-- 8-pointed star -->
    <path d="M 0,-60 L 10,-20 L 42,-42 L 20,-10 L 60,0 L 20,10 L 42,42 L 10,20 L 0,60 L -10,20 L -42,42 L -20,10 L -60,0 L -20,-10 L -42,-42 L -10,-20 Z"/>
  </g>
  
  <!-- Crescent moon accent -->
  <g transform="translate(100, 100)">
    <circle cx="-5" cy="-25" r="15" fill="white" opacity="0.95"/>
    <circle cx="0" cy="-25" r="15" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Text container -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">
    Faizan-E-Sarwari
  </text>
</svg>
